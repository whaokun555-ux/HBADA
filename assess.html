<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>黑白调人才测评 · 14项完整版</title>
<style>
:root{--bg:#f8f9fc;--card:#fff;--accent:#2c3e6b;--red:#e74c3c;--blue:#3498db;--yellow:#f39c12;--green:#27ae60;--text:#333;--text2:#777;--border:#e0e4ea;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:680px;margin:0 auto;line-height:1.7}
header{background:linear-gradient(135deg,#1a1a2e,#2c3e6b);color:#fff;text-align:center;padding:24px 20px}
header h1{font-size:20px}header p{font-size:12px;opacity:.8;margin-top:4px}
main{padding:16px;padding-bottom:40px}
.instruction{background:#fef9e7;border:1px solid #f0d9a8;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:#8a6d3b;line-height:1.8}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.card h3{font-size:14px;margin-bottom:10px;color:var(--accent)}
input,select{width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;font-family:inherit;outline:none;background:#fafbfc}
input:focus{border-color:var(--accent)}
.q-item{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.q-num{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}
.q-text{font-size:14px;font-weight:600;margin-bottom:8px}
.opt{display:block;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:4px;cursor:pointer;font-size:13px;transition:.2s;background:#fafbfc}
.opt:hover{border-color:var(--accent)}
.opt input{margin-right:8px;accent-color:var(--accent);width:auto}
.opt:has(input:checked){border-color:var(--accent);background:#eef2fa}
.btn{padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.btn-submit{background:linear-gradient(135deg,var(--accent),#4a6fa5);color:#fff;margin-top:8px}
.btn-submit:active{transform:scale(.97)}

.result{display:none;text-align:center;padding:24px 0}
.result h2{font-size:22px;margin-bottom:16px}
.dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.dim-card{padding:16px;border-radius:var(--radius);text-align:center}
.dim-card .score{font-size:36px;font-weight:800}
.dim-card .label{font-size:12px;margin-top:4px;font-weight:600}
.dim-red{background:#fdeaea;border:2px solid var(--red)}.dim-red .score{color:var(--red)}
.dim-blue{background:#eaf0fa;border:2px solid var(--blue)}.dim-blue .score{color:var(--blue)}
.dim-yellow{background:#fef9e7;border:2px solid var(--yellow)}.dim-yellow .score{color:var(--yellow)}
.dim-green{background:#eafaf1;border:2px solid var(--green)}.dim-green .score{color:var(--green)}
.warning{background:#fdedec;border-left:4px solid var(--red);padding:12px 16px;margin:12px 0;border-radius:0 8px 8px 0;font-size:13px;display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><h1>黑白调人才测评</h1><p>14项完整版 · 共30题</p></header>
<main>
<form id="quizForm">
  <div class="instruction">
    📋 <b>填写说明：</b>请选择最符合您的选项，都是单选题。选择让您"最自然的""最舒服的"反应，而非"最好的""最适合的"。您回答的是"我是谁"。
  </div>

  <div class="card"><h3>📝 基本信息</h3>
    <div class="q-item"><label class="q-text">* 您的姓名</label><input type="text" id="name" required></div>
    <div class="q-item"><label class="q-text">* 应聘岗位</label><input type="text" id="position" required></div>
    <div class="q-item"><label class="q-text">* 性别</label><select id="gender" required><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
    <div class="q-item"><label class="q-text">* 籍贯</label><input type="text" id="hometown" required></div>
    <div class="q-item"><label class="q-text">* 出生日期</label><input type="date" id="birthday" required></div>
    <div class="q-item"><label class="q-text">* 手机号码</label><input type="tel" id="phone" required></div>
  </div>

  <div class="card"><h3>📋 测评题目（请逐题作答）</h3><div id="questions"></div></div>

  <button type="submit" class="btn btn-submit">提 交 测 评</button>
</form>

<div class="result" id="resultArea">
  <h2>📊 测评结果</h2>
  <p id="resultName" style="font-size:14px;color:var(--text2)"></p>
  <div class="dim-grid" id="dimGrid"></div>
  <div class="warning" id="warning"></div>
  <p style="margin-top:12px;font-size:13px;color:var(--text2)" id="resultInterpret"></p>
  <button class="btn btn-submit" onclick="location.reload()" style="margin-top:16px">重新测评</button>
</div>

<div class="toast" id="toast"></div>
</main>

<script>
const QUESTIONS = [
  {n:6, text:'关于人生观，我的内心其实是：', opts:{A:'希望能有各种各样的人生体验，所以想法极其多样化。',B:'在合理的基础上，谨慎确定目标，一旦确定会坚定不移地去做。',C:'更加在乎取得一切有可能的成就。',D:'毫不喜欢风险，喜欢享受稳定或现状。'}},
  {n:7, text:'如果爬山旅游，大多数状况下，在下山回来的路线我最可能：', opts:{A:'好玩有趣，所以宁愿新路线回巢。',B:'安全稳妥，所以宁愿原路线返回。',C:'挑战困难，所以宁愿新路线回巢。',D:'方便省心，所以宁愿原路线返回。'}},
  {n:8, text:'说话时，我更看重：', opts:{A:'感觉效果。有时可能会略显得夸张。',B:'描述精确。有时可能略过冗长。',C:'达成结果。有时可能过于直接让别人不高兴。',D:'人际感受。有时可能会不愿讲真话。'}},
  {n:9, text:'在大多数时候，我的内心更想要：', opts:{A:'刺激。经常冒出新点子，想做就做，喜欢与众不同。',B:'安全。头脑冷静，不易冲动。',C:'挑战。生命中竞赛随处可见，有强烈的"赢"的欲望。',D:'稳定。满足自己所拥有的，很少羡慕别人。'}},
  {n:10, text:'我认为自己在情感上的基本特点是：', opts:{A:'情绪多变，经常波动。',B:'外表自我抑制强，但内心感情起伏大，一旦挫伤难以平复。',C:'感情不拖泥带水，只是一旦不稳定，容易发怒。',D:'天性情绪四平八稳。'}},
  {n:11, text:'我认为自己除了工作外，在控制欲上面，我：', opts:{A:'没有控制欲，只有感染带动他人的欲望，但自控能力不算强。',B:'用规则和纪律来约束自己和他人。',C:'希望掌控局面，做决策的主导者。',D:'避免控制他人，更喜欢和谐相处。'}},
  {n:12, text:'与人交往时，我最希望对方：', opts:{A:'经常赞美我，让我享受开心、被关怀且又有一定自由。',B:'可随时默契到我内心所想，对我的需求极其敏感。',C:'得到对方的认可，我是正确的并且我对其是有价值的。',D:'尊重并且相处静谧的。'}},
  {n:13, text:'在人际交往时，我：', opts:{A:'本质上还是认为与人交往比长时间独处是有乐趣的。',B:'非常审慎缓慢地进入，常会被人认为容易有距离感。',C:'希望在人际关系中占据主导地位。',D:'顺其自然，不温不火，相对被动。'}},
  {n:14, text:'我做事情，经常：', opts:{A:'缺少长性，不喜欢长期做相同无变化的事情。',B:'缺少果断，期待最好的结果但总能先看到事情的不利面。',C:'缺少耐性，有时行事过于草率。',D:'缺少紧迫，行动迟缓，难下决心。'}},
  {n:15, text:'通常我完成任务的方式是：', opts:{A:'常赶在最后期限前完成，是临时抱佛脚的高手。',B:'自己有严格规定的程序，精确地做，不要麻烦别人。',C:'先做，快速做。',D:'使用传统的方法按部就班，需要时从他人处得到帮忙。'}},
  {n:16, text:'如果有人深深惹恼我时，我：', opts:{A:'内心感到受伤，认为没有原谅的可能，可最终很多时候还是会原谅对方。',B:'深深感到愤怒，如此之深怎可忘记？我会牢记，同时未来完全避开那个家伙。',C:'会火冒三丈，并且内心期望有机会狠狠地回应。',D:'避免摊牌，因为还不到那个地步或者自己再去找新朋友。'}},
  {n:17, text:'在人际关系中，我最在意的是：', opts:{A:'得到他人的赞美和欢迎。',B:'得到他人的理解和欣赏。',C:'得到他人的感激和尊敬。',D:'得到他人的尊重和接纳。'}},
  {n:18, text:'在工作上，我表现出来更多的是：', opts:{A:'充满热忱，有很多想法且很有灵性。',B:'心思细腻，完美精确，而且为人可靠。',C:'坚强而直截了当，而且有推动力。',D:'有耐心，适应性强而且善于协调。'}},
  {n:19, text:'我过往的老师最有可能对我的评价是：', opts:{A:'情绪起伏大，善于表达和抒发情感。',B:'严格保护自己的私密，有时会显得孤独或是不合群。',C:'动作敏捷又独立，并且喜欢自己做事情。',D:'看起来安稳轻松，反应度偏低，比较温和。'}},
  {n:20, text:'朋友对我的评价最有可能的是：', opts:{A:'喜欢对朋友述说，也有感染别人的力量。',B:'能够提出很多周全的问题，而且需要许多精细的解说。',C:'愿意直言想法，有时会直率而犀利地谈论不喜欢的人、事、物。',D:'通常与他人一起是倾听者。'}},
  {n:21, text:'在帮助他人的问题上，我内心的想法是：', opts:{A:'别人来找我，不太会拒绝，会尽力帮他。',B:'值得帮助的人应该帮助。',C:'很少承诺要帮，但我若承诺必兑现。',D:'虽无英雄打虎胆，常有自告奋勇心。'}},
  {n:22, text:'面对他人对自己的赞美，我内心：', opts:{A:'没有也无所谓，特别欣喜那也不至于。',B:'我不需无关痛痒的赞美，宁可对方欣赏我的能力。',C:'思考对方的真实性或立即回避众人的关注。',D:'赞美多多益善，总是令人愉悦的。'}},
  {n:23, text:'面对生活，我更像：', opts:{A:'随和派-外面的世界我无关，我觉得自己这样还不错。',B:'行动派-我不进步，别人就会进步，所以我必须不停地前进。',C:'分析派-在问题未发生之前，就该想好所有的可能。',D:'无忧派-每天的生活开心快乐最重要。'}},
  {n:24, text:'对于规则，我内心的态度是：', opts:{A:'不愿违反规则，但可能因为松散而无法达到规则的要求。',B:'打破规则，希望由自己来制定规则而不是遵守规则。',C:'严格遵守规则，并且竭尽全力做到规则内的最好。',D:'不喜被规则束缚，不按规则出牌会觉得新鲜有趣。'}},
  {n:25, text:'我认为自己在行为上的基本特点是：', opts:{A:'慢条斯理，办事按部就班，能与周围的人协调一致。',B:'目标明确，集中精力为实现目标而努力，善于抓住核心要点。',C:'慎重小心，为做好预防及善后，会不惜一切而尽心操劳。',D:'丰富跃动，不喜欢制度和约束，倾向于快速反应。'}},
  {n:26, text:'当我做错事时，我倾向于：', opts:{A:'害怕但表面不露声色。',B:'不承认而且辩驳，但内心其实已经明白。',C:'愧疚和痛苦，容易停留在自我压抑中。',D:'难为情，希望逃避别人的批评。'}},
  {n:27, text:'当结束一段刻骨铭心的感情时，我会：', opts:{A:'很难受，可日子总要过，时间会冲淡一切的。',B:'虽然觉得受伤，但一旦下定决心，就会努力把过去的影子忘掉。',C:'深陷在悲伤的情绪中，在相当长的时期里难以自拔，也不愿再接受新的人。',D:'痛不欲生，需要找朋友倾诉或者找到渠道发泄，寻求化解之道。'}},
  {n:28, text:'面对他人的倾诉，我回顾自己大多时候本能上倾向于：', opts:{A:'能够认同并理解对方当时的感受。',B:'快速做出一些定论或判断。',C:'给予一些分析或推理，帮助对方理顺思路。',D:'可能会随着他的情绪起伏而起伏，也会发表一些评论或意见。'}},
  {n:29, text:'我在以下哪个群体中交流较感满足？', opts:{A:'舒服轻松的氛围中，心平气和地最终达成一致结论。',B:'彼此展开充分激烈的辩论并有收获。',C:'有意义地详细讨论事情的好坏和影响。',D:'很开心并且随意无拘束地闲谈。'}},
  {n:30, text:'在内心的真实想法里，我觉得工作：', opts:{A:'不必有太大压力，可以让我做我熟悉的工作就很不错。',B:'应该以最快的速度完成，且争取去完成更多的任务。',C:'要么不做，要做就做到最好。',D:'如果能将好玩融合其中那就太棒了，不过如果不喜欢的工作实在没劲。'}},
  {n:31, text:'如果我是领导，我内心更希望在部属心目中，我是：', opts:{A:'可以亲近的和善于为他们着想的。',B:'有很强的能力和富有领导力的。',C:'公平公正且足以信赖的。',D:'被他们喜欢并且觉得富有感召力的。'}},
  {n:32, text:'我对认同的需求是：', opts:{A:'无论别人是否认同，生活都是要继续的。',B:'精英群体的认同最重要。',C:'只要我在乎的那些人认同我就足够了。',D:'所见之人无论贵贱都对我认同那有多好。'}},
  {n:33, text:'当我还是个孩子的时候，我：', opts:{A:'不太会积极尝试新事物，通常比较喜欢旧有的和熟悉的。',B:'是孩子王，大家经常听我的决定。',C:'害羞见生人，有意识地回避。',D:'调皮可爱，乐观而又热心。'}},
  {n:34, text:'如果我是父母，我也许是：', opts:{A:'容易说服或者宽容的。',B:'比较严厉、性急及说一不二的。',C:'坚持自己的想法和比较挑剔的。',D:'积极参与到子女中一起玩，被小朋友们热烈欢迎的。'}},
  {n:35, text:'以下四组格言，哪组整体上最符合我的感觉？', opts:{A:'最深刻的真理是最简单和最平凡的。要在人世间取得成功必须大智若愚。好脾气是一个人在社交中所能穿着的最佳服饰。知足是人生在世最大的幸福。',B:'走自己的路，让人家去说吧。虽然世界充满了苦难，但是苦难总是能战胜的。有所成就就是人生唯一的真正的乐趣。对我而言，解决一个问题比享受一个假期一样好。',C:'一个不注意小事情的人，永远不会成功大事业。理性是灵魂中最高贵的因素。切忌浮夸铺张。与其说得过分，不如说得不全。谨慎比大胆要有力量得多。',D:'幸福在于对生命的喜悦和激情。任何时候都要最真实地对待你自己，这比什么都重要。使生活变成幻想，再把幻想化为现实。幸福不在于拥有金钱，而在于获得成就时的喜悦以及产生创造力的激情。'}},
];

// Render questions
let html='';
QUESTIONS.forEach((q,i)=>{
  html+=`<div class="q-item"><div class="q-num">第${i+1}题 / 共30题</div><div class="q-text">${q.text}</div>`;
  Object.entries(q.opts).forEach(([k,v])=>{
    html+=`<label class="opt"><input type="radio" name="q${i}" value="${k}" required> <b>${k}.</b> ${v}</label>`;
  });
  html+=`</div>`;
});
document.getElementById('questions').innerHTML=html;

// Submit
document.getElementById('quizForm').addEventListener('submit',function(e){
  e.preventDefault();

  // Check all answered
  let allDone=true;
  for(let i=0;i<30;i++){
    const sel=this.querySelector(`input[name="q${i}"]:checked`);
    if(!sel){allDone=false;break}
  }
  if(!allDone){toast('请完成全部30道题后再提交');return}

  // Collect answers
  const answers=[];
  for(let i=0;i<30;i++){
    const sel=this.querySelector(`input[name="q${i}"]:checked`).value;
    // Map A/B/C/D to 1/2/3/4
    answers.push({A:1,B:2,C:3,D:4}[sel]);
  }

  // Calculate dimensions
  const first15=answers.slice(0,15),last15=answers.slice(15);
  const count=(arr,n)=>arr.filter(x=>x===n).length;

  const red=count(first15,1)+count(last15,4);
  const blue=count(first15,2)+count(last15,3);
  const yellow=count(first15,3)+count(last15,2);
  const green=count(first15,4)+count(last15,1);

  // Display results
  document.getElementById('quizForm').style.display='none';
  document.getElementById('resultArea').style.display='block';
  document.getElementById('resultName').innerHTML=`<b>${document.getElementById('name').value}</b> | ${document.getElementById('position').value}`;

  const dims=[{n:'🔴 红色·新鲜',s:red,c:'dim-red',desc:'追求刺激、变化、新鲜感。喜欢尝试新事物，敢于冒险。'},{n:'🔵 蓝色·理性',s:blue,c:'dim-blue',desc:'注重逻辑、分析、精确。做事谨慎，喜欢计划和规则。'},{n:'🟡 黄色·执行',s:yellow,c:'dim-yellow',desc:'目标导向、行动力强。喜欢主导，追求结果和成就。'},{n:'🟢 绿色·享乐',s:green,c:'dim-green',desc:'重视和谐、稳定、舒适。为人温和，避免冲突，享受当下。'}];

  const max=Math.max(red,blue,yellow,green);
  const top=dims.filter(d=>d.s===max);

  document.getElementById('dimGrid').innerHTML=dims.map(d=>`<div class="dim-card ${d.c}"><div class="score">${d.s}</div><div class="label">${d.n}</div><div style="font-size:10px;color:var(--text2);margin-top:4px">/15</div></div>`).join('');

  document.getElementById('resultInterpret').innerHTML=`<b>主导特质：${top.map(d=>d.n).join('、')}</b><br>${top[0].desc}${top.length>1?'<br>'+top[1].desc:''}`;

  // Warning
  const warn=document.getElementById('warning');
  if(red<5||green>10){
    warn.style.display='block';
    warn.innerHTML=`⚠️ <b>需要重点关注！</b>${red<5?' 红色（新鲜）维度得分低于5，该候选人可能缺乏主动性和创新意愿。':''}${green>10?' 绿色（享乐）维度得分高于10，该候选人可能过于追求舒适安逸，缺乏进取动力。':''}`;
  }

  // Scroll to result
  document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});

  // Send to Feishu
  const name=document.getElementById('name').value;
  const pos=document.getElementById('position').value;
  const phone=document.getElementById('phone').value;
  const FEISHU='https://open.feishu.cn/open-apis/bot/v2/hook/e70726df-e73b-4e4b-a66a-6db1cc04683d';
  fetch(FEISHU,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    msg_type:'interactive',card:{header:{title:{tag:'plain_text',content:'📊 新测评结果'},template:'blue'},
    elements:[{tag:'div',text:{tag:'lark_md',content:`**${name}** | ${pos} | ${phone}\n---\n🔴红色·新鲜：**${red}**/15\n🔵蓝色·理性：**${blue}**/15\n🟡黄色·执行：**${yellow}**/15\n🟢绿色·享乐：**${green}**/15\n\n${red<5||green>10?'⚠️ **重点关注！**':'✅ 结果正常'}`}}]
  }}).catch(()=>{});
});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}
</script>
